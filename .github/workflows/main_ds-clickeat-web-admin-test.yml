# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Flutter web app to Azure Web App - DS-CLICKEAT-WEB-ADMIN-TEST

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --dart-define=API_BASE_URL=https://ws.test.ds-clickeat.com.mx/api/admin/

      - name: Add static server for Azure App Service
        run: |
          cat > build/web/package.json <<'EOF'
          {
            "name": "ds-clickeat-web-admin",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node server.js"
            },
            "dependencies": {
              "express": "^4.19.2"
            }
          }
          EOF
          cat > build/web/server.js <<'EOF'
          const express = require('express');
          const path = require('path');

          const app = express();
          const port = process.env.PORT || 8080;

          app.use(express.static(__dirname));
          app.get('*', (req, res) => {
            res.sendFile(path.join(__dirname, 'index.html'));
          });

          app.listen(port, () => {
            console.log(`Server running on port ${port}`);
          });
          EOF

      - name: Install server dependencies
        run: npm install --omit=dev --prefix build/web

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: web-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_66B52623875443A597EB5052BB3A2F9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F087944949ED48038762037E7C8B7F5A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B5753401F94C4F31BEDF716D35EAB52C }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'DS-CLICKEAT-WEB-ADMIN-TEST'
          slot-name: 'Production'
          package: .
